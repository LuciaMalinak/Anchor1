# Render "Blueprint" — lets Render create the web service and the
# database together from one click instead of configuring each by hand.
# In the Render dashboard: New -> Blueprint -> pick this repo.
services:
  - type: web
    name: anchor
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anchor-db
          property: connectionString
      - key: AUTH_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RECALL_API_KEY
        sync: false
      - key: RECALL_REGION
        sync: false
      - key: RECALL_WEBHOOK_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: GOOGLE_INTEGRATION_CLIENT_ID
        sync: false
      - key: GOOGLE_INTEGRATION_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_INTEGRATION_CLIENT_ID
        sync: false
      - key: MICROSOFT_INTEGRATION_CLIENT_SECRET
        sync: false
      - key: SLACK_INTEGRATION_CLIENT_ID
        sync: false
      - key: SLACK_INTEGRATION_CLIENT_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
# Note: no persistent disk here — Render's free tier doesn't support one.
# Uploaded files (profile photos, meeting recordings, deal files) go to
# local disk and do NOT survive a restart or redeploy UNLESS the four R2_*
# vars above are set, in which case src/lib/storage.ts writes to Cloudflare
# R2 instead (see .env.example for how to get those values). Set them
# before relying on uploads sticking around.

databases:
  - name: anchor-db
    plan: free
