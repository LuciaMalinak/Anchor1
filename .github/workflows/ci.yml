name: Checks

# Every change to main, and every pull request: type-check the web app and
# fail on any known critical vulnerability in what ships to production.
# Also runs weekly, so a newly published vulnerability is caught even when
# nothing changed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Type-check
        # LayoutProps / PageProps are generated by Next into .next/types.
        run: npx next typegen && npx tsc --noEmit
      - name: Dependency vulnerabilities (web app)
        run: npm audit --omit=dev --audit-level=critical
      - name: Dependency vulnerabilities (desktop app)
        working-directory: desktop
        run: npm audit --omit=dev --audit-level=critical --package-lock-only
