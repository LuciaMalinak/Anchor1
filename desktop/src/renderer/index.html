<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Anchor Desktop</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 20px;
        color: #1e293b;
        background: #f8fafc;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      p.sub {
        color: #64748b;
        font-size: 12px;
        margin: 0 0 16px;
      }
      section {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 14px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 12px;
        margin-bottom: 8px;
      }
      button {
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 12px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.stop {
        background: #dc2626;
      }
      .meeting {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid #f1f5f9;
        font-size: 12px;
      }
      .meeting:last-child {
        border-bottom: none;
      }
      #log {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: #475569;
        max-height: 160px;
        overflow-y: auto;
        white-space: pre-wrap;
      }
      #status {
        font-size: 11px;
        color: #64748b;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Anchor Desktop</h1>
    <p class="sub">Records Zoom, Teams, and Meet calls straight from your computer — no bot joins the call.</p>

    <section id="token-section">
      <div id="status">Not connected</div>
      <input id="token-input" type="password" placeholder="Paste your desktop token from Anchor's Integrations page" />
      <button id="save-token">Save token</button>
    </section>

    <section>
      <strong style="font-size: 12px">Detected meetings</strong>
      <div id="meetings" style="margin-top: 8px">
        <p style="font-size: 12px; color: #94a3b8">Open a Zoom, Teams, or Meet call — it'll show up here.</p>
      </div>
    </section>

    <section>
      <strong style="font-size: 12px">Activity</strong>
      <div id="log" style="margin-top: 8px"></div>
    </section>

    <script src="renderer.js"></script>
  </body>
</html>
